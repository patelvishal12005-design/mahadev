<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mahadev Decor</title>
  <script>
    // GitHub Pages SPA redirect for HashRouter
    var path = window.location.pathname;
    var base = '/mahadev/';
    var route = path.replace(base, '');
    if (route) {
      window.location.replace(base + '#/' + route);
    } else {
      window.location.replace(base);
    }
  </script>
</head>
<body>
</body>
</html>
